<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Showcase</title>
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9fa;
            --bg-card: #ffffff;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --border-color: #e0e0e0;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --shadow-hover: 0 8px 16px rgba(0, 0, 0, 0.15);
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --on-accent: #ffffff;
            --radius: 12px;
            --spacing-sm: 0.5rem;
            --spacing-md: 1rem;
            --spacing-lg: 1.5rem;
            --spacing-xl: 2rem;
            --transition: all 0.3s ease;
        }

        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            --shadow-hover: 0 8px 16px rgba(0, 0, 0, 0.4);
            --accent: #60a5fa;
            --accent-hover: #3b82f6;
            --on-accent: #0f172a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* Lets the `hidden` attribute win over any display rule below */
        [hidden] { display: none !important; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            transition: var(--transition);
            line-height: 1.6;
        }

        .header {
            background-color: var(--bg-secondary);
            padding: var(--spacing-lg) var(--spacing-xl);
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--spacing-md);
            flex-wrap: wrap;
        }

        .controls {
            display: flex;
            gap: var(--spacing-md);
            align-items: center;
            flex-wrap: wrap;
        }

        .header h1 { font-size: clamp(1.5rem, 4vw, 2rem); font-weight: 700; }

        .theme-toggle {
            background-color: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 50px;
            padding: var(--spacing-sm) var(--spacing-md);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            transition: var(--transition);
            font-size: 1rem;
            color: var(--text-primary);
            font-weight: 500;
        }

        .theme-toggle:hover { transform: scale(1.05); border-color: var(--accent); }

        .filter-select,
        .limit-select {
            background-color: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: var(--radius);
            padding: var(--spacing-sm) var(--spacing-md);
            color: var(--text-primary);
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition);
            min-width: 150px;
        }

        .filter-select:hover,
        .limit-select:hover { border-color: var(--accent); }

        .filter-select:focus,
        .limit-select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .container { max-width: 1400px; margin: 0 auto; padding: var(--spacing-xl); }

        .filters-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-lg);
            padding: var(--spacing-md);
            background-color: var(--bg-secondary);
            border-radius: var(--radius);
            flex-wrap: wrap;
            gap: var(--spacing-md);
        }

        .results-count { color: var(--text-secondary); font-size: 0.95rem; }

        .pagination-footer {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: var(--spacing-xl);
            padding: var(--spacing-xl) var(--spacing-lg);
            background-color: transparent;
            flex-wrap: wrap;
            gap: var(--spacing-sm);
        }

        .pagination { display: flex; gap: var(--spacing-sm); align-items: center; flex-wrap: wrap; }

        .pagination button {
            background-color: transparent;
            border: none;
            border-radius: 4px;
            padding: var(--spacing-sm) var(--spacing-md);
            color: var(--accent);
            cursor: pointer;
            transition: var(--transition);
            font-weight: 500;
            min-width: 36px;
            height: 36px;
            font-size: 0.95rem;
        }

        .pagination button:hover:not(:disabled):not(.active) { background-color: var(--bg-secondary); }
        .pagination button:disabled { opacity: 0.4; cursor: not-allowed; color: var(--text-secondary); }
        .pagination button.active { background-color: var(--accent); color: var(--on-accent); }
        .pagination button.nav-btn { color: var(--text-primary); }
        .pagination button.nav-btn:hover:not(:disabled) { color: var(--accent); }

        .page-info { color: var(--text-secondary); font-size: 0.9rem; padding: 0 var(--spacing-sm); }

        .loading { text-align: center; padding: var(--spacing-xl); font-size: 1.2rem; color: var(--text-secondary); }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: var(--spacing-lg);
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .product-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            overflow: hidden;
            transition: var(--transition);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-hover);
            border-color: var(--accent);
        }

        .product-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            background-color: var(--bg-secondary);
        }

        .product-content {
            padding: var(--spacing-lg);
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
        }

        .product-category {
            color: var(--accent);
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .product-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
            margin: var(--spacing-sm) 0;
        }

        .product-description {
            color: var(--text-secondary);
            font-size: 0.9rem;
            flex: 1;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--spacing-md);
            margin-top: var(--spacing-md);
            padding-top: var(--spacing-md);
            border-top: 1px solid var(--border-color);
        }

        /* Primary action button (affiliate link) */
        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.6rem 1.25rem;
            background-color: var(--accent);
            color: var(--on-accent);
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            white-space: nowrap;
            transition: var(--transition);
        }

        .btn-primary:hover { background-color: var(--accent-hover); }

        .btn-primary.is-disabled {
            background-color: var(--bg-secondary);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            cursor: not-allowed;
        }

        /* Secondary text link (view more) */
        .link-subtle {
            color: var(--text-secondary);
            font-size: 0.9rem;
            text-decoration: underline;
            text-decoration-color: transparent;
            text-underline-offset: 4px;
            transition: var(--transition);
        }

        .link-subtle:hover { color: var(--accent); text-decoration-color: currentColor; }

        .btn-primary:focus-visible,
        .link-subtle:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        @media (max-width: 768px) {
            .container { padding: var(--spacing-md); }
            .products-grid { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: var(--spacing-md); }
            .header { padding: var(--spacing-md); }
        }

        @media (max-width: 480px) {
            .products-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <h1>Product Showcase</h1>
            <div class="controls">
                <select class="filter-select" id="categoryFilter">
                    <option value="all">All Categories</option>
                </select>
                <select class="limit-select" id="limitSelect">
                    <option value="6">6 per page</option>
                    <option value="10" selected>10 per page</option>
                    <option value="20">20 per page</option>
                    <option value="50">50 per page</option>
                </select>
                <button class="theme-toggle" id="themeToggle">
                    <span id="themeIcon">🌙</span>
                    <span id="themeText">Dark Mode</span>
                </button>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="loading" id="loading">Loading products...</div>
        <div class="filters-info" id="filtersInfo" style="display: none;">
            <div class="results-count" id="resultsCount"></div>
        </div>
        <div class="products-grid" id="productsGrid"></div>
        <div class="pagination-footer" id="paginationFooter" style="display: none;">
            <div class="pagination" id="pagination"></div>
        </div>
    </main>

    <script>
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const themeText = document.getElementById('themeText');
        const productsGrid = document.getElementById('productsGrid');
        const loading = document.getElementById('loading');
        const categoryFilter = document.getElementById('categoryFilter');
        const limitSelect = document.getElementById('limitSelect');
        const filtersInfo = document.getElementById('filtersInfo');
        const resultsCount = document.getElementById('resultsCount');
        const paginationFooter = document.getElementById('paginationFooter');
        const paginationEl = document.getElementById('pagination');

        let allProducts = [];
        let filteredProducts = [];
        let currentPage = 1;
        let itemsPerPage = 10;

        // All user-facing card text lives here (easy to change or translate).
        const UI_TEXT = {
            buyLabel: 'Buy now',
            buyUnavailable: 'Unavailable',
            viewMoreLabel: 'View more'
        };

        // Theme toggle
        const savedTheme = 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        updateThemeButton(savedTheme);

        themeToggle.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
            updateThemeButton(newTheme);
        });

        function updateThemeButton(theme) {
            if (theme === 'dark') {
                themeIcon.textContent = '☀️';
                themeText.textContent = 'Light Mode';
            } else {
                themeIcon.textContent = '🌙';
                themeText.textContent = 'Dark Mode';
            }
        }

        // Fetch and display products
        async function fetchProducts() {
            try {
                const response = await fetch('https://openapi-wof3.onrender.com/api/v1/data');
                const result = await response.json();

                // Handle all known API formats (items / item / bare array)
                const list = result?.data?.items ?? result?.data?.item;
                if (result.success && Array.isArray(list)) {
                    allProducts = list;
                } else if (Array.isArray(result)) {
                    allProducts = result;
                } else {
                    throw new Error('Unexpected API response format');
                }

                populateCategoryFilter();
                filterProducts();
            } catch (error) {
                loading.textContent = 'Failed to load products. Please try again later.';
                console.error('Error fetching products:', error);
            }
        }

        function getCategory(product) {
            const category = product.payload?.category || product.category;
            return typeof category === 'string' ? category.trim() : category;
        }

        function populateCategoryFilter() {
            const categories = new Set();
            allProducts.forEach(product => {
                const category = getCategory(product);
                if (category) categories.add(category);
            });
            categories.forEach(category => {
                const option = document.createElement('option');
                option.value = category;
                option.textContent = category;
                categoryFilter.appendChild(option);
            });
        }

        function filterProducts() {
            const selectedCategory = categoryFilter.value;
            filteredProducts = selectedCategory === 'all'
                ? [...allProducts]
                : allProducts.filter(product => getCategory(product) === selectedCategory);
            currentPage = 1;
            displayProducts();
        }

        function displayProducts() {
            loading.style.display = 'none';
            filtersInfo.style.display = 'flex';
            paginationFooter.style.display = 'flex';
            productsGrid.innerHTML = '';

            const startIndex = (currentPage - 1) * itemsPerPage;
            const productsToShow = filteredProducts.slice(startIndex, startIndex + itemsPerPage);

            productsToShow.forEach(product => {
                productsGrid.appendChild(createProductCard(product));
            });

            updateResultsCount();
            updatePagination();
        }

        function updateResultsCount() {
            const startIndex = (currentPage - 1) * itemsPerPage + 1;
            const endIndex = Math.min(currentPage * itemsPerPage, filteredProducts.length);
            resultsCount.textContent = `Showing ${startIndex}-${endIndex} of ${filteredProducts.length} products`;
        }

        function goToPage(page) {
            currentPage = page;
            displayProducts();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function updatePagination() {
            const totalPages = Math.ceil(filteredProducts.length / itemsPerPage);
            paginationEl.innerHTML = '';

            if (totalPages <= 1) {
                paginationFooter.style.display = 'none';
                return;
            }

            paginationFooter.style.display = 'flex';

            const makeButton = (label, onClick, { className = '', disabled = false } = {}) => {
                const btn = document.createElement('button');
                btn.textContent = label;
                if (className) btn.className = className;
                btn.disabled = disabled;
                btn.addEventListener('click', onClick);
                return btn;
            };
            const makeDots = () => {
                const dots = document.createElement('span');
                dots.className = 'page-info';
                dots.textContent = '...';
                return dots;
            };

            paginationEl.appendChild(makeButton('← prev', () => goToPage(currentPage - 1), {
                className: 'nav-btn', disabled: currentPage === 1
            }));

            const maxVisiblePages = 5;
            let startPage = Math.max(1, currentPage - Math.floor(maxVisiblePages / 2));
            let endPage = Math.min(totalPages, startPage + maxVisiblePages - 1);
            if (endPage - startPage < maxVisiblePages - 1) {
                startPage = Math.max(1, endPage - maxVisiblePages + 1);
            }

            if (startPage > 1) {
                paginationEl.appendChild(makeButton('1', () => goToPage(1)));
                if (startPage > 2) paginationEl.appendChild(makeDots());
            }

            for (let i = startPage; i <= endPage; i++) {
                paginationEl.appendChild(makeButton(String(i), () => goToPage(i), {
                    className: i === currentPage ? 'active' : ''
                }));
            }

            if (endPage < totalPages) {
                if (endPage < totalPages - 1) paginationEl.appendChild(makeDots());
                paginationEl.appendChild(makeButton(String(totalPages), () => goToPage(totalPages)));
            }

            paginationEl.appendChild(makeButton('next →', () => goToPage(currentPage + 1), {
                className: 'nav-btn', disabled: currentPage === totalPages
            }));
        }

        // Event listeners
        categoryFilter.addEventListener('change', filterProducts);

        limitSelect.addEventListener('change', () => {
            itemsPerPage = parseInt(limitSelect.value, 10);
            currentPage = 1;
            displayProducts();
        });

        /*
         * Card layout definition.
         *   dataKey   -> text (or img src) read from the normalized product
         *   hrefKey   -> link target read from the normalized product (validated)
         *   labelKey  -> text looked up in UI_TEXT
         *   whenMissing (links only) -> 'hide' (default) or 'disable' when there is no valid URL
         *   fallback  -> text shown when a dataKey value is empty
         */
        const cardStructure = {
            container: { tag: 'div', class: 'product-card', children: ['image', 'content'] },
            image: { tag: 'img', class: 'product-image', dataKey: 'image', altKey: 'title', attrs: { loading: 'lazy' } },
            content: { tag: 'div', class: 'product-content', children: ['category', 'title', 'description', 'footer'] },
            category: { tag: 'div', class: 'product-category', dataKey: 'category', fallback: 'Uncategorized' },
            title: { tag: 'h2', class: 'product-title', dataKey: 'title', fallback: 'Untitled product' },
            description: { tag: 'p', class: 'product-description', dataKey: 'description', fallback: 'No description available' },
            footer: { tag: 'div', class: 'product-footer', children: ['buyButton', 'viewMore'] },
            buyButton: {
                tag: 'a', class: 'btn-primary',
                hrefKey: 'url', labelKey: 'buyLabel',
                disabledLabelKey: 'buyUnavailable', whenMissing: 'disable'
            },
            viewMore: {
                tag: 'a', class: 'link-subtle',
                hrefKey: 'moreUrl', labelKey: 'viewMoreLabel',
                whenMissing: 'hide', external: false
            }
        };

        // Resolve the first usable value from a list of possible API keys.
        function getAlias(data, keys, fallback = undefined) {
            for (const key of keys) {
                const value = key.split('.').reduce((obj, part) => obj?.[part], data);
                if (value !== undefined && value !== null &&
                    !(typeof value === 'string' && value.trim() === '')) {
                    return value;
                }
            }
            return fallback;
        }

        function getNestedValue(obj, key) {
            if (typeof key !== 'string' || !key.trim()) return undefined;
            if (obj === null || obj === undefined) return undefined;
            return key.split('.').reduce(
                (value, part) => (value !== null && value !== undefined ? value[part] : undefined),
                obj
            );
        }

        // Only allow http(s) URLs so a bad payload can never inject javascript: links.
        function safeUrl(value) {
            if (typeof value !== 'string' || !value.trim()) return null;
            try {
                const url = new URL(value.trim(), window.location.href);
                return ['http:', 'https:'].includes(url.protocol) ? url.href : null;
            } catch {
                return null;
            }
        }

        function createElement(config, data) {
            const el = document.createElement(config.tag);

            if (config.class) el.className = config.class;

            if (config.attrs) {
                Object.entries(config.attrs).forEach(([key, value]) => {
                    if (value !== undefined && value !== null) el.setAttribute(key, String(value));
                });
            }

            // Text / image values
            if (typeof config.dataKey === 'string') {
                const value = getNestedValue(data, config.dataKey);

                if (config.tag === 'img') {
                    el.alt = config.altKey ? String(getNestedValue(data, config.altKey) ?? '') : '';
                    if (typeof value === 'string' && value.trim()) {
                        el.src = value;
                        el.hidden = false;
                        el.addEventListener('error', () => { el.hidden = true; }, { once: true });
                    } else {
                        el.hidden = true;
                    }
                } else {
                    el.textContent =
                        value !== undefined && value !== null && value !== ''
                            ? String(value)
                            : config.fallback ?? '';
                }
            }

            // Link / button values
            if (typeof config.hrefKey === 'string') {
                const href = safeUrl(getNestedValue(data, config.hrefKey));
                el.textContent = UI_TEXT[config.labelKey] ?? '';

                if (href) {
                    el.href = href;
                    if (config.external !== false) {
                        el.target = '_blank';
                        el.rel = 'sponsored nofollow noopener noreferrer';
                    }
                } else if (config.whenMissing === 'disable') {
                    el.textContent = UI_TEXT[config.disabledLabelKey] ?? el.textContent;
                    el.classList.add('is-disabled');
                    el.setAttribute('aria-disabled', 'true');
                    el.setAttribute('role', 'link');
                } else {
                    el.hidden = true;
                }
            }

            // Recursively build children.
            if (Array.isArray(config.children)) {
                config.children.forEach(childKey => {
                    const childConfig = cardStructure[childKey];
                    if (!childConfig) {
                        console.warn(`Missing cardStructure configuration for: ${childKey}`);
                        return;
                    }
                    el.appendChild(createElement(childConfig, data));
                });
            }

            return el;
        }

        function createProductCard(product) {
            return createElement(cardStructure.container, normalizeProduct(product));
        }

        // Builds a NEW display object; the original API response is never modified.
        function normalizeProduct(input) {
            const payload = input?.payload ?? input ?? {};
            const text = value => (typeof value === 'string' ? value.trim() : value);

            const title = text(getAlias(payload, ['title', 'genericName', 'name', 'productName'], 'Untitled product'));
            const image = getAlias(payload, ['imageUrl', 'image', 'imageURL', 'thumbnail', 'images.0'], '');
            const category = text(getAlias(payload, ['category', 'productCategory'], 'Uncategorized'));
            const description = text(getAlias(payload, ['description', 'productDescription', 'details'], 'No description available'));

            const rawPrice = getAlias(payload, ['price', 'salePrice', 'amount']);
            const currency = getAlias(payload, ['currency'], 'INR');

            // Treat zero, empty and invalid prices as unavailable.
            const numericPrice =
                rawPrice !== undefined && rawPrice !== '' &&
                Number.isFinite(Number(rawPrice)) && Number(rawPrice) > 0
                    ? Number(rawPrice)
                    : null;

            const priceLabel = numericPrice !== null
                ? new Intl.NumberFormat('en-IN', { style: 'currency', currency, maximumFractionDigits: 2 }).format(numericPrice)
                : 'Price unavailable';

            // Support both numeric ratings and older { rate, count } objects.
            const rawRating = getAlias(payload, ['rating', 'reviews.rating', 'review.rate']);
            const rawCount = getAlias(payload, ['reviewsCount', 'rating.count', 'reviewCount', 'review_count', 'reviews.count']);
            const isRatingObject = typeof rawRating === 'object' && rawRating !== null;
            const ratingValue = isRatingObject ? Number(rawRating.rate) : Number(rawRating);
            const ratingCount = isRatingObject ? Number(rawRating.count ?? rawCount) : Number(rawCount);
            const hasRating = rawRating !== undefined && rawRating !== null &&
                Number.isFinite(ratingValue) && ratingValue > 0;

            const ratingLabel = hasRating
                ? `★ ${ratingValue.toFixed(1)}${Number.isFinite(ratingCount) && ratingCount > 0 ? ` (${ratingCount} reviews)` : ''}`
                : 'No ratings';

            return {
                id: input?._id ?? payload._id ?? null,
                asin: getAlias(payload, ['Asin', 'asin'], ''),
                title,
                image,
                category,
                description,
                price: numericPrice,
                currency,
                priceLabel,
                rating: hasRating ? ratingValue : null,
                reviewsCount: Number.isFinite(ratingCount) && ratingCount > 0 ? ratingCount : 0,
                ratingLabel,
                // Buy button target (affiliate link)
                url: getAlias(payload, ['affiliateUrl', 'url', 'productUrl'], ''),
                // "View more" target - planned API field; several likely names are accepted.
                moreUrl: getAlias(payload, ['viewMoreUrl', 'detailsUrl', 'detailUrl', 'details.url', 'affiliateUrl'], ''),
                tags: getAlias(payload, ['tags'], [])
            };
        }

        // Initialize
        fetchProducts();
    </script>
</body>
</html>
