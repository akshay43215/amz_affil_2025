<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Cards with Loader</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f4f9;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .card-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      overflow: hidden;
      transition: transform 0.2s;
    }

    .card:hover {
      transform: scale(1.05);
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .card-content {
      padding: 15px;
    }

    .card-content h3 {
      margin: 0 0 10px;
      font-size: 1.2rem;
      color: #333;
    }

    .card-content p {
      margin: 0;
      color: #666;
      font-size: 0.95rem;
    }

    /* Loader Styles */
    .loader {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 200px;
    }

    .spinner {
      border: 6px solid #f3f3f3;
      border-top: 6px solid #3498db;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <h1>Dynamic Items</h1>

  <!-- Loader -->
  <div id="loader" class="loader">
    <div class="spinner"></div>
  </div>

  <!-- Cards -->
  <div class="card-container" id="cardContainer" style="display:none;"></div>

  <script>
    const apiUrl = "https://fakestoreapi.com/products";

    async function loadItems() {
      const loader = document.getElementById("loader");
      const container = document.getElementById("cardContainer");

      try {
        // Show loader
        loader.style.display = "flex";
        container.style.display = "none";

        const response = await fetch(apiUrl);
        const data = await response.json();

        container.innerHTML = ""; // Clear existing

        // data.forEach(item => {
        //   const card = document.createElement("div");
        //   card.className = "card";

        //   card.innerHTML = `
        //     <img src="${item.image}" alt="${item.title}">
        //     <div class="card-content">
        //       <h3>${item.title}</h3>
        //       <p>${item.description.substring(0, 80)}...</p>
        //       <p><strong>$${item.price}</strong></p>
        //     </div>
        //   `;

        //   container.appendChild(card);
        // });

        data.forEach(item => {
          const card = document.createElement("div");
          card.className = "card";

          // If there's an image key, handle separately
          let imgTag = "";
          if (item.image) {
            imgTag = `<img src="${item.image}" alt="${item.title || "item"}">`;
          }

          // Build content from all keys dynamically
          let contentHtml = "<div class='card-content'>";
          for (const [key, value] of Object.entries(item)) {
            if (key === "image") continue;

            let displayValue = String(value);

            // Handle long text values (like description)
            if (displayValue.length > 100) {
              const shortText = displayValue.substring(0, 100) + "...";
              const fullText = displayValue;

              contentHtml += `
                <p>
                <strong>${key}:</strong> 
                <span class="short-text">${shortText}</span>
                <span class="full-text" style="display:none;">${fullText}</span>
                <button class="toggle-btn">More</button>
                </p>
            `;
            } else {
              contentHtml += `<p><strong>${key}:</strong> ${displayValue}</p>`;
            }
          }
          contentHtml += "</div>";

          card.innerHTML = imgTag + contentHtml;
          container.appendChild(card);
        });

        // Add toggle functionality
        container.addEventListener("click", function (e) {
          if (e.target.classList.contains("toggle-btn")) {
            const btn = e.target;
            const shortText = btn.parentElement.querySelector(".short-text");
            const fullText = btn.parentElement.querySelector(".full-text");

            if (fullText.style.display === "none") {
              shortText.style.display = "none";
              fullText.style.display = "inline";
              btn.textContent = "Less";
            } else {
              shortText.style.display = "inline";
              fullText.style.display = "none";
              btn.textContent = "More";
            }
          }
        });
        


        // Hide loader and show cards
        loader.style.display = "none";
        container.style.display = "grid";

      } catch (error) {
        console.error("Error loading items:", error);
        loader.innerHTML = "<p>Failed to load data.</p>";
      }
    }

    // Ensure it runs after DOM is ready
    document.addEventListener("DOMContentLoaded", loadItems);
  </script>

</body>
</html>
